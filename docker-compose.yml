services:
  agent:
    build:
      context: ./Agent
      dockerfile: Dockerfile
    image: lasercho/dockwatch-agent:latest
    container_name: dockwatch-agent
    restart: always
    pid: "host"
    ports:
      - "9000:9000"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      - PORT=9000
      - AGENT_SECRET_TOKEN=1
    networks:
      - dockwatch_network

  host:
    build:
      context: ./Host
      dockerfile: Dockerfile
    image: lasercho/dockwatch-host:latest
    container_name: dockwatch-host
    restart: always
    ports:
      - "3000:3000"
    volumes:
      - ./data:/app/data
    environment:
      - PORT=3000
      - APP_TITLE=DockWatch
      - ADMIN_USER=dw_sec_mgr
      - ADMIN_PASSWORD=Admin123!@#
      - SESSION_IDLE_TIMEOUT_MINUTES=10
      - INACTIVE_ACCOUNT_DAYS=90
      - LOG_RETENTION_DAYS=365
      - AUTH_LOG_RETENTION_DAYS=1825
      - WATCH_LIST_PATH=/app/data/watch_list.bin
      - HISTORY_LOG_PATH=/app/data/history_log.bin
      - USERS_PATH=/app/data/users.bin
      - SYSTEM_LOG_PATH=/app/data/system_logs.bin
    depends_on:
      - agent
    networks:
      - dockwatch_network

networks:
  dockwatch_network:
    name: dockwatch_network


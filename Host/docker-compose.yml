version: '3.8'

services:
  fake-portainer-host:
    build:
      context: .
      dockerfile: Dockerfile
    image: fake-portainer-host:latest
    container_name: fake-portainer-host
    restart: always
    ports:
      - "3000:3000"
    volumes:
      - ./watch_list.txt:/app/watch_list.txt
    environment:
      - NODE_ENV=production
      - PORT=3000
      - ADMIN_USER=admin
      - ADMIN_PASSWORD=admin123

services:
  dockwatch-host:
    image: lasercho/dockwatch-host-distroless:latest
    container_name: dockwatch-host
    restart: always
    ports:
      - "3000:3000"
    volumes:
      - ./data:/app/data
    environment:
      - NODE_ENV=production
      - PORT=3000
      - APP_TITLE=DockWatch
      - ADMIN_USER=dw_sec_mgr
      - ADMIN_PASSWORD=Admin123!@#
      - SESSION_IDLE_TIMEOUT_MINUTES=10
      - INACTIVE_ACCOUNT_DAYS=90
      - LOG_RETENTION_DAYS=365
      - AUTH_LOG_RETENTION_DAYS=1825
      - WATCH_LIST_PATH=/app/data/watch_list.bin
      - HISTORY_LOG_PATH=/app/data/history_log.bin
      - USERS_PATH=/app/data/users.bin
      - SYSTEM_LOG_PATH=/app/data/system_logs.bin
    networks:
      - dockwatch_network

networks:
  dockwatch_network:
    name: dockwatch_network

